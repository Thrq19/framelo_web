<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framelo Booth - Download</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            font-family: 'Space Mono', monospace;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify_content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border: 3px solid black;
            box-shadow: 10px 10px 0px 0px #000;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px 0;
            text-transform: uppercase;
            border-bottom: 3px solid black;
            padding-bottom: 10px;
            font-weight: 900;
        }

        #status { color: #666; margin: 20px 0; font-weight: bold; }

        img {
            max-width: 100%;
            border: 2px solid black;
            display: none;
            margin: 20px auto;
            box-shadow: 5px 5px 0px #eee;
        }

        /* --- STYLE TOMBOL BARU --- */
        .btn-container { display: none; margin-top: 20px; }

        .btn {
            display: block;
            background: white;
            color: black;
            padding: 15px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            border: 2px solid black;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }

        .btn:hover {
            background: #000;
            color: #fff;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px 0px #ccc;
        }

        /* Ikon kecil di tombol */
        .btn::before { content: '📁'; margin-right: 10px; }
        .btn-pic::before { content: '🖼️'; }
        .btn-gif::before { content: '✨'; }
        .btn-vid::before { content: '📹'; }
        .btn-raw::before { content: '💾'; }

        .footer {
            margin-top: 30px;
            font-size: 10px;
            color: #888;
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Framelo Booth</h1>
        <p id="status">Mengambil data...</p>
        
        <img id="preview" src="" alt="Foto Kamu">

        <div class="btn-container" id="buttons">
            <a id="btn-pic" href="#" class="btn btn-pic" download>Download Picture</a>
            
            <a id="btn-gif" href="#" class="btn btn-gif" download style="display:none">Download GIF</a>

            <a id="btn-vid" href="#" class="btn btn-vid" download style="display:none">Download Video</a>

            <a id="btn-raw" href="#" class="btn btn-raw" download style="display:none">Original Photos (ZIP)</a>
        </div>

        <div class="footer">
            File dihapus otomatis dalam 30 hari.<br>
            Framelo Booth © 2026
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Ambil semua parameter
        const photoUrl = params.get('foto');
        const gifUrl = params.get('gif');
        const videoUrl = params.get('video');
        const zipUrl = params.get('zip'); // Untuk original files

        const statusEl = document.getElementById('status');
        const imgEl = document.getElementById('preview');
        const btnGroup = document.getElementById('buttons');

        if (photoUrl) {
            // Setup Foto Utama
            imgEl.src = photoUrl;
            document.getElementById('btn-pic').href = photoUrl;

            imgEl.onload = () => {
                statusEl.style.display = 'none';
                imgEl.style.display = 'block';
                btnGroup.style.display = 'block';
            };

            // Setup Tombol GIF
            if (gifUrl && gifUrl !== "None") {
                const btnGif = document.getElementById('btn-gif');
                btnGif.href = gifUrl;
                btnGif.style.display = 'block';
            }

            // Setup Tombol VIDEO
            if (videoUrl && videoUrl !== "None") {
                const btnVid = document.getElementById('btn-vid');
                btnVid.href = videoUrl;
                btnVid.style.display = 'block';
            }

            // Setup Tombol ORIGINAL (ZIP)
            if (zipUrl && zipUrl !== "None") {
                const btnRaw = document.getElementById('btn-raw');
                btnRaw.href = zipUrl;
                btnRaw.style.display = 'block';
            }

        } else {
            statusEl.innerHTML = "⚠️ Silakan scan QR Code lagi.";
        }
    </script>
</body>
</html>
