<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framelo Booth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Space+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Space Mono', monospace;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify_content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        /* --- LOGO --- */
        .logo-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 42px;
            font-weight: 600;
            color: #3b82f6;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 5px;
            line-height: 1;
        }
        .logo-sub {
            font-size: 14px;
            color: #555;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* --- TOMBOL MENU --- */
        .btn {
            display: block;
            background: white;
            color: black;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid black;
            box-shadow: 5px 5px 0px 0px #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            text-transform: capitalize;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 8px;
            width: 100%;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0px 0px #000; }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #000;
            font-weight: bold;
            line-height: 1.5;
        }

        /* --- HALAMAN PREVIEW (HIDDEN BY DEFAULT) --- */
        #preview-section {
            display: none; /* Sembunyi dulu */
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        .back-btn {
            align-self: flex-start;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: 'Fredoka', sans-serif;
        }

        .preview-card {
            border: 2px solid black;
            padding: 10px;
            background: white;
            box-shadow: 8px 8px 0px #eee;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        /* Media di dalam preview */
        .preview-media {
            width: 100%;
            display: block;
            border: 1px solid #ccc;
            cursor: pointer; /* Biar user tau bisa diklik */
        }

        .instruction {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
            font-weight: bold;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-3px);}
        }

        /* --- MODAL ORIGINAL (GRID) --- */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 20px; width: 90%; max-width: 400px;
            max-height: 80vh; overflow-y: auto; border-radius: 10px;
            position: relative;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 24px;
            cursor: pointer;
        }
        .grid-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
        }
        .grid-item img { width: 100%; border-radius: 5px; border: 1px solid #ccc; cursor: pointer;}
        
        #loading { font-size: 14px; color: #666; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="container" id="main-menu">
        <div class="logo-text">Framelo<br>Booth</div>
        <div class="logo-sub">CAPTURE MOMENTS</div>

        <div id="loading">Memuat data...</div>

        <div id="menu-buttons" style="display: none;">
            <button id="btn-pic" class="btn">Picture</button>
            <button id="btn-raw-trigger" class="btn" onclick="openOriginalsGrid()">Original Image</button>
            <button id="btn-gif" class="btn" style="display:none">GIF</button>
            <button id="btn-vid" class="btn" style="display:none">Video</button>
        </div>

        <div class="footer">
            Your soft files will be erased in 30 days,<br>don't forget to save it 😉
        </div>
    </div>

    <div id="preview-section">
        <button class="back-btn" onclick="goBack()">← Back</button>
        
        <div class="preview-card">
            <div id="media-container">
                </div>
            <div class="instruction">👆 TAP IMAGE TO SAVE</div>
        </div>
    </div>

    <div id="modal-originals" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeOriginalsGrid()">&times;</span>
            <h3>Select to Preview</h3>
            <div id="originals-grid" class="grid-container"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('id');

        const loadingEl = document.getElementById('loading');
        const mainMenuEl = document.getElementById('main-menu');
        const menuButtonsEl = document.getElementById('menu-buttons');
        const previewSectionEl = document.getElementById('preview-section');
        const mediaContainerEl = document.getElementById('media-container');

        // --- FUNGSI DOWNLOAD OTOMATIS ---
        async function forceDownload(url, filename, elementToFeedback) {
            const originalOpacity = elementToFeedback.style.opacity;
            elementToFeedback.style.opacity = "0.5"; // Efek visual lagi loading
            
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                window.open(url, '_blank');
            } finally {
                elementToFeedback.style.opacity = "1"; // Balikin normal
                alert("Downloading started...");
            }
        }

        // --- FUNGSI NAVIGASI: BUKA PREVIEW ---
        function showPreview(url, type, filenameBase) {
            // 1. Sembunyikan Menu Utama & Modal Grid
            mainMenuEl.style.display = 'none';
            document.getElementById('modal-originals').style.display = 'none';
            
            // 2. Bersihkan container lama
            mediaContainerEl.innerHTML = '';

            // 3. Buat Elemen Baru (Gambar atau Video)
            let mediaElement;

            if (type === 'video') {
                mediaElement = document.createElement('video');
                mediaElement.src = url;
                mediaElement.autoplay = true;
                mediaElement.loop = true;
                mediaElement.muted = true; // Wajib muted biar autoplay jalan di HP
                mediaElement.playsInline = true;
                mediaElement.className = 'preview-media';
            } else {
                mediaElement = document.createElement('img');
                mediaElement.src = url;
                mediaElement.className = 'preview-media';
            }

            // 4. PASANG EVENT: KLIK MEDIA -> DOWNLOAD
            mediaElement.onclick = () => {
                const ext = type === 'video' ? 'mp4' : (type === 'gif' ? 'gif' : 'jpg');
                forceDownload(url, `${filenameBase}.${ext}`, mediaElement);
            };

            mediaContainerEl.appendChild(mediaElement);

            // 5. Tampilkan Halaman Preview
            previewSectionEl.style.display = 'flex';
        }

        // --- FUNGSI NAVIGASI: KEMBALI KE MENU ---
        function goBack() {
            previewSectionEl.style.display = 'none';
            mainMenuEl.style.display = 'block';
            mediaContainerEl.innerHTML = ''; // Stop video/clear memori
        }

        // --- DATA LOADING ---
        async function loadData() {
            if (!sessionId) { loadingEl.innerText = "⚠️ Error QR Code."; return; }

            try {
                const response = await fetch(`/api/get?id=${sessionId}`);
                const data = await response.json();
                if (!response.ok) throw new Error("Data not found");

                // BUTTON 1: PICTURE
                if (data.photo_url) {
                    document.getElementById('btn-pic').onclick = () => 
                        showPreview(data.photo_url, 'image', `Framelo_Pic_${sessionId}`);
                }

                // BUTTON 2: GIF
                if (data.gif_url) {
                    const btn = document.getElementById('btn-gif');
                    btn.style.display = 'block';
                    btn.onclick = () => showPreview(data.gif_url, 'gif', `Framelo_Gif_${sessionId}`);
                }

                // BUTTON 3: VIDEO
                if (data.video_url) {
                    const btn = document.getElementById('btn-vid');
                    btn.style.display = 'block';
                    btn.onclick = () => showPreview(data.video_url, 'video', `Framelo_Video_${sessionId}`);
                }

                // BUTTON 4: ORIGINAL (GRID)
                if (data.original_urls && Array.isArray(data.original_urls)) {
                    const grid = document.getElementById('originals-grid');
                    data.original_urls.forEach((url, index) => {
                        const img = document.createElement('img');
                        img.src = url;
                        // Kalau klik salah satu foto di grid -> Masuk ke Preview Mode foto itu
                        img.onclick = () => showPreview(url, 'image', `Original_${sessionId}_${index+1}`);
                        
                        const item = document.createElement('div');
                        item.className = 'grid-item';
                        item.appendChild(img);
                        grid.appendChild(item);
                    });
                } else {
                    document.getElementById('btn-raw-trigger').style.display = 'none';
                }

                loadingEl.style.display = 'none';
                menuButtonsEl.style.display = 'block';

            } catch (err) {
                loadingEl.innerText = "❌ " + err.message;
            }
        }

        // Modal Logic
        function openOriginalsGrid() { document.getElementById('modal-originals').style.display = 'flex'; }
        function closeOriginalsGrid() { document.getElementById('modal-originals').style.display = 'none'; }

        loadData();
    </script>
</body>
</html>
